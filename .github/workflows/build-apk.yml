name: Build Qalam Android APK

# The Android app of Qalam: the same office space as app.html, with the phone's own powers (notifications, the device
# calendar, the QALAM folder, the documents shared to the app, the voice dictation, Google Drive).
# The public law texts and the free fonts travel inside the app; nothing belonging to an office is built into it.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apk/**'
      - 'data/**'
      - 'fonts/**'
      - 'lib/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apk
    env:
      HAS_KEY: ${{ secrets.QALAM_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install ImageMagick (for the icons)
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          command -v convert > /dev/null || sudo ln -s "$(command -v magick)" /usr/local/bin/convert
          command -v identify > /dev/null || sudo ln -s "$(command -v magick)" /usr/local/bin/identify
          convert -version | head -1

      - name: Prepare web files
        run: |
          mkdir -p www/icons www/fonts www/lib www/data
          cp index.html www/index.html
          sed -i "s/__APPV__/1.${{ github.run_number }}/; s/__APPD__/$(date -u +%Y-%m-%d)/" www/index.html
          cp icons/logo.png www/icons/logo.png
          cp -r ../lib/pdfjs www/lib/pdfjs
          cp ../fonts/*.woff2 ../fonts/*.ttf www/fonts/
          cp -r ../data/lex www/data/lex
          cp -r ../data/fonts www/data/fonts
          du -sh www

      # The signing key: the repository's secret when it is set (QALAM_KEYSTORE_B64, QALAM_KEYSTORE_PASSWORD,
      # QALAM_KEY_ALIAS, QALAM_KEY_PASSWORD); otherwise the key kept in this repository's Actions cache, made once
      # and kept alive by keep-signing-key.yml, so that each new APK installs over the previous one as an update.
      # The key is never written into the repository (it is public).
      - name: Signing key from the repository's secret
        if: env.HAS_KEY == 'true'
        env:
          KS: ${{ secrets.QALAM_KEYSTORE_B64 }}
        run: |
          echo "$KS" | base64 -d > qalam.keystore
          echo "KS_PASS=${{ secrets.QALAM_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KS_ALIAS=${{ secrets.QALAM_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "KS_KEYPASS=${{ secrets.QALAM_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Signing key kept in the Actions cache
        if: env.HAS_KEY != 'true'
        uses: actions/cache@v4
        with:
          path: apk/qalam-ci.keystore
          key: qalam-signing-v1

      - name: Make the cached key the first time
        if: env.HAS_KEY != 'true'
        run: |
          if [ ! -f qalam-ci.keystore ]; then
            keytool -genkeypair -keystore qalam-ci.keystore -storepass qalam-ci -alias qalam -keypass qalam-ci \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Qalam, O=Qalam, C=MA"
          fi
          cp qalam-ci.keystore qalam.keystore
          echo "KS_PASS=qalam-ci" >> "$GITHUB_ENV"
          echo "KS_ALIAS=qalam" >> "$GITHUB_ENV"
          echo "KS_KEYPASS=qalam-ci" >> "$GITHUB_ENV"

      - name: Android SDK platform (best effort)
        continue-on-error: true
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install

      - name: Create the Android project
        run: npx cap add android

      - name: The app's name — «قلم» on a phone in Arabic, «Qalam» in French, English and the other languages
        run: |
          python3 - <<'PY'
          import os, re
          d = 'android/app/src/main/res'
          p = d + '/values/strings.xml'
          s = open(p, encoding='utf-8').read()
          ar = s
          s = re.sub(r'(<string name="(?:app_name|title_activity_main)">)[^<]*(</string>)', r'\1Qalam\2', s)
          open(p, 'w', encoding='utf-8').write(s)
          os.makedirs(d + '/values-ar', exist_ok=True)
          names = re.findall(r'<string name="(?:app_name|title_activity_main)">[^<]*</string>', ar)
          open(d + '/values-ar/strings.xml', 'w', encoding='utf-8').write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    ' + '\n    '.join(names) + '\n</resources>\n')
          PY
          cat android/app/src/main/res/values/strings.xml android/app/src/main/res/values-ar/strings.xml

      - name: Google Play services for the access to Google Drive
        run: |
          python3 - <<'PY'
          p = 'android/app/build.gradle'
          s = open(p, encoding='utf-8').read()
          i = s.rindex('dependencies {') + len('dependencies {')
          s = s[:i] + "\n    implementation 'com.google.android.gms:play-services-auth:21.2.0'" + s[i:]
          open(p, 'w', encoding='utf-8').write(s)
          PY
          grep -n "play-services-auth" android/app/build.gradle

      - name: Sign every build with the same key (so that a new APK installs over the old one)
        run: |
          python3 - <<'PY'
          import os
          p = 'android/app/build.gradle'
          s = open(p, encoding='utf-8').read()
          q = lambda v: v.replace('\\', '\\\\').replace('"', '\\"')
          cfg = '''android {
              signingConfigs {
                  debug {
                      storeFile file("${rootDir}/../qalam.keystore")
                      storePassword "%s"
                      keyAlias "%s"
                      keyPassword "%s"
                  }
              }
          ''' % (q(os.environ['KS_PASS']), q(os.environ['KS_ALIAS']), q(os.environ['KS_KEYPASS']))
          i = s.index('android {')
          s = s[:i] + cfg + s[i + len('android {'):]
          open(p, 'w', encoding='utf-8').write(s)
          PY
          grep -n -A3 "signingConfigs" android/app/build.gradle | grep -v Password

      - name: Version number
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "version" android/app/build.gradle | head

      - name: App icon and splash screen
        run: bash make-icons.sh

      - name: Permissions, notification icon and native code
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />\n    <uses-permission android:name="android.permission.READ_CALENDAR" />\n    <uses-permission android:name="android.permission.WRITE_CALENDAR" />\n    <queries><package android:name="com.justice.service" /><package android:name="com.anthropic.claude" /><package android:name="com.openai.chatgpt" /><package android:name="com.google.android.apps.bard" /><package android:name="com.microsoft.copilot" /><package android:name="ai.perplexity.app.android" /><package android:name="com.deepseek.chat" /><intent><action android:name="android.speech.RecognitionService" /></intent><intent><action android:name="android.speech.action.RECOGNIZE_SPEECH" /></intent></queries>\n    <application|' android/app/src/main/AndroidManifest.xml
          grep -n "uses-permission" android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/drawable
          cp ic_stat_qalam.png android/app/src/main/res/drawable/ic_stat_qalam.png
          D=android/app/src/main/java/ma/qalam/app
          mkdir -p $D
          cp native/CalendarPlugin.java native/FileSaverPlugin.java native/ShareInPlugin.java native/MainActivity.java $D/

      - name: Receive documents shared to the app
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          f = open('share-filters.xml', encoding='utf-8').read()
          i = s.index('</activity>')
          s = s[:i] + f + '        ' + s[i:]
          open(p, 'w', encoding='utf-8').write(s)
          PY
          grep -n 'intent.action' android/app/src/main/AndroidManifest.xml
          F=android/app/src/main/res/xml/file_paths.xml
          if [ -f "$F" ]; then grep -q '<cache-path' "$F" || sed -i 's|</paths>|    <cache-path name="zl_cache" path="." />\n</paths>|' "$F"; else mkdir -p "$(dirname "$F")"; printf '<?xml version="1.0" encoding="utf-8"?>\n<paths xmlns:android="http://schemas.android.com/apk/res/android">\n    <cache-path name="zl_cache" path="." />\n</paths>\n' > "$F"; fi
          cat "$F"; grep -n 'fileprovider' android/app/src/main/AndroidManifest.xml || echo 'no fileprovider declared'

      - name: Sync web files
        run: npx cap sync android

      - name: Build the APK
        working-directory: apk/android
        run: ./gradlew assembleDebug

      - name: Name the file and print its signature
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk qalam.apk
          keytool -printcert -jarfile qalam.apk | grep -E 'SHA1|SHA256' || true

      - uses: actions/upload-artifact@v4
        with:
          name: qalam-apk
          path: apk/qalam.apk

      - name: Publish a release with the APK
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: qalam-apk-${{ github.run_number }}
          name: قلم APK ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref_name != 'main' }}
          body: |
            تطبيق «قلم» لنظام Android، الإصدار 1.${{ github.run_number }} (الفرع ${{ github.ref_name }}).
          files: apk/qalam.apk
