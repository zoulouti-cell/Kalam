.shell{width:min(100%,590px);display:flex;flex-direction:column;align-items:center;gap:18px}
.logo{width:min(300px,65vw);height:auto;max-height:130px;object-fit:contain;filter:drop-shadow(0 6px 18px #0008)}
.card{width:100%;padding:32px 34px 30px;background:rgba(255,252,245,.95);border:1px solid rgba(255,255,255,.65);border-radius:20px;box-shadow:0 24px 75px #0008;backdrop-filter:blur(12px)}
h1{margin:0 0 8px;text-align:center;font-size:23px;color:#173f34}.sub{text-align:center;color:#847968;font-size:13px;margin:0 0 24px}
.field{display:flex;align-items:center;gap:12px;margin:0 0 15px;padding:0 15px;border:1px solid #ded4c5;border-radius:11px;background:rgba(255,255,255,.65);height:56px}.field span{font-size:19px;color:#9a8a71}.field input{width:100%;min-width:0;border:0;outline:0;background:transparent;font:inherit;color:#173c31}.show{border:0;background:transparent;color:#6f786e;padding:5px}
.primary,.digital{width:100%;height:56px;border-radius:11px;font:700 16px inherit;cursor:pointer}.primary{margin-top:7px;border:1px solid #c49a54;color:#fff;background:linear-gradient(120deg,#0b3b34,#052b29);box-shadow:0 6px 16px #09382e25}.divider{display:flex;align-items:center;gap:12px;margin:15px 0;color:#938777;font-size:13px}.divider:before,.divider:after{content:"";height:1px;background:#d8cebf;flex:1}.digital{border:1px solid #244b43;background:transparent;color:#21483f}.note{margin:15px 0 0;text-align:center;color:#897d6b;font-size:11px;line-height:1.7}.back{color:#f8edda;text-decoration:none;font-size:13px;text-shadow:0 1px 6px #000}.back:hover{text-decoration:underline}
@media(max-width:520px){body{padding:20px 12px;background-attachment:scroll}.card{padding:26px 20px 23px}.logo{max-height:105px}.shell{gap:13px}}

<body><main class="shell">
<img class="logo" src="https://raw.githubusercontent.com/zoulouti-cell/Kalam/main/assets/qalam-logo.png" alt="شعار قلم">
<section class="card" aria-labelledby="loginTitle"><h1 id="loginTitle">تسجيل الدخول</h1><p class="sub">مرحبًا بك في مساحة العمل القانونية «قلم»</p>
<form id="loginForm">
<label class="field"><span aria-hidden="true">♙</span><input id="username" autocomplete="username" placeholder="اسم المستخدم" required aria-label="اسم المستخدم"></label>
<label class="field"><span aria-hidden="true">▣</span><input id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور" required aria-label="كلمة المرور"><button class="show" type="button" id="showPassword" aria-label="إظهار كلمة المرور">◉</button></label>
<button class="primary" type="submit">تسجيل الدخول　↪</button>
<div class="divider">أو</div><button class="digital" type="button" id="digitalLogin">♙　الدخول عبر الهوية الرقمية</button>
<p class="note" id="notice">واجهة الدخول جاهزة بصريًا؛ يلزم ربطها بخادم مصادقة آمن لتفعيل تسجيل الدخول الفعلي.</p>
</form></section><a class="back" href="./index.html">العودة إلى الصفحة الرئيسية</a>
</main><script>
const pw=document.querySelector('#password');document.querySelector('#showPassword').addEventListener('click',()=>{pw.type=pw.type==='password'?'text':'password'});
document.querySelector('#loginForm').addEventListener('submit',e=>{e.preventDefault();document.querySelector('#notice').textContent='لم يُفعّل التحقق من بيانات الدخول بعد. يجب ربط الصفحة بخادم مصادقة آمن.'});
document.querySelector('#digitalLogin').addEventListener('click',()=>{document.querySelector('#notice').textContent='الدخول عبر الهوية الرقمية غير مفعّل بعد ويحتاج إلى تكامل رسمي مع مزوّد الهوية.'});
</script></body></html>
