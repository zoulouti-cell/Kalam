<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123d36"><title>كلام | ملفاتي والقضايا</title>
<style>
:root{--bg:#f4f6f5;--panel:#fff;--ink:#182724;--muted:#657570;--brand:#123d36;--line:#dfe7e3;--soft:#eaf1ee;--danger:#a33b37}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 Tahoma,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:9px 13px;background:var(--brand);color:#fff}.secondary{background:var(--soft);color:var(--brand);border:1px solid var(--line)}.danger{background:#fff0ef;color:var(--danger)}header{background:var(--brand);color:#fff;padding:18px max(16px,calc((100vw - 1100px)/2));display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}header h1{margin:0;font-size:21px}header a{color:#fff}main{max-width:1100px;margin:22px auto;padding:0 16px}.panel,.item{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px;margin-bottom:14px}.row{display:flex;gap:9px;flex-wrap:wrap}.row input{flex:1;min-width:200px}.field{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}.list{display:grid;gap:10px}.item h3{margin:0 0 6px}.muted{color:var(--muted);font-size:13px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.actions button{font-size:13px}.empty{text-align:center;padding:28px;color:var(--muted)}.hide{display:none!important}.notice{background:#fff8e8;border:1px solid #f1dfb8;padding:10px;border-radius:9px;font-size:13px}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head>
<body>
<header><div><h1>⚖ كلام — ملفاتي والقضايا</h1><div class="muted" style="color:#d4e3dd">نسخة أولية لإدارة الملفات محليًا</div></div><div class="row"><a href="./index.html">العودة إلى المكتبة</a><button id="export">تصدير الملفات</button><button class="secondary" id="importBtn">استيراد</button><input id="importFile" type="file" accept="application/json" class="hide"></div></header>
<main>
<section class="panel"><h2 style="margin-top:0">إضافة ملف أو البحث</h2><div class="row"><input id="search" class="field" placeholder="ابحث برقم الملف أو العنوان أو المحكمة أو الأطراف"><button id="new">＋ ملف جديد</button></div><p class="notice">تُحفظ البيانات في هذا المتصفح فقط. لا تحفظ بيانات الموكلين الحساسة على جهاز مشترك، وصدّر نسخة احتياطية مشفرة/آمنة عند الحاجة.</p></section>
<section id="formWrap"></section><section id="list" class="list"></section>
</main>
<script>
const KEY='kalam_cases_v1';let cases=[];let editing=null;
try{cases=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(cases))cases=[]}catch{cases=[]}
const $=s=>document.querySelector(s), esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function save(){localStorage.setItem(KEY,JSON.stringify(cases));render()}
function form(c={}){$('#formWrap').innerHTML='<form id="caseForm" class="panel grid"><h2 class="full" style="margin:0">'+(c.id?'تعديل الملف':'ملف جديد')+'</h2><input type="hidden" name="id" value="'+esc(c.id)+'"><div class="full"><label>عنوان الملف *</label><input class="field" name="title" required value="'+esc(c.title)+'" placeholder="موضوع القضية"></div><div><label>رقم الملف</label><input class="field" name="number" value="'+esc(c.number)+'"></div><div><label>نوع القضية</label><select class="field" name="type"><option>مدني</option><option>جنحي</option><option>جنائي</option><option>أسرة</option><option>تجاري</option><option>إداري</option><option>أخرى</option></select></div><div><label>المحكمة</label><input class="field" name="court" value="'+esc(c.court)+'"></div><div><label>القاعة</label><input class="field" name="room" value="'+esc(c.room)+'"></div><div><label>الموكل / الأطراف</label><input class="field" name="parties" value="'+esc(c.parties)+'"></div><div><label>الخصم</label><input class="field" name="opponent" value="'+esc(c.opponent)+'"></div><div><label>القاضي المقرر</label><input class="field" name="judge" value="'+esc(c.judge)+'"></div><div><label>الحالة</label><select class="field" name="status"><option>قيد المعالجة</option><option>مؤجل</option><option>محجوز للمداولة</option><option>منتهٍ</option></select></div><div><label>تاريخ الجلسة القادمة</label><input class="field" type="date" name="nextDate" value="'+esc(c.nextDate)+'"></div><div><label>الإجراء السابق</label><input class="field" name="previousAction" value="'+esc(c.previousAction)+'"></div><div class="full"><label>الإجراء المطلوب / الملاحظات</label><textarea class="field" rows="4" name="notes">'+esc(c.notes)+'</textarea></div><div class="full"><button type="submit">حفظ الملف</button> <button type="button" class="secondary" id="cancel">إلغاء</button></div></form>';const sel=$('#caseForm [name=type]');sel.value=c.type||'مدني';$('#caseForm [name=status]').value=c.status||'قيد المعالجة';$('#cancel').onclick=()=>{$('#formWrap').innerHTML='';editing=null}}
function render(){const q=$('#search').value.trim().toLowerCase();const found=cases.filter(c=>[c.title,c.number,c.type,c.court,c.room,c.parties,c.opponent,c.judge,c.status,c.notes].join(' ').toLowerCase().includes(q));$('#list').innerHTML=found.length?found.map(c=>'<article class="item"><div class="muted">'+esc(c.type)+' · '+esc(c.status)+'</div><h3>'+esc(c.title)+'</h3><p><b>رقم الملف:</b> '+esc(c.number||'—')+'　 <b>المحكمة:</b> '+esc(c.court||'—')+'　 <b>القاعة:</b> '+esc(c.room||'—')+'</p><p><b>الأطراف:</b> '+esc(c.parties||'—')+'　 <b>الخصم:</b> '+esc(c.opponent||'—')+'</p><p><b>الجلسة القادمة:</b> '+esc(c.nextDate||'غير محددة')+'　 <b>القاضي المقرر:</b> '+esc(c.judge||'—')+'</p>'+(c.previousAction?'<p><b>الإجراء السابق:</b> '+esc(c.previousAction)+'</p>':'')+(c.notes?'<p>'+esc(c.notes)+'</p>':'')+'<div class="actions"><button class="secondary" data-edit="'+c.id+'">تعديل</button><button class="secondary" data-print="'+c.id+'">طباعة</button><button class="danger" data-delete="'+c.id+'">حذف</button></div></article>').join(''):'<div class="panel empty">لا توجد ملفات مطابقة. أضف ملفًا جديدًا للبدء.</div>'}
$('#new').onclick=()=>form();$('#search').oninput=render;
document.addEventListener('submit',e=>{if(e.target.id!=='caseForm')return;e.preventDefault();const f=new FormData(e.target),id=f.get('id')||uid();const c={id,title:f.get('title').trim(),number:f.get('number').trim(),type:f.get('type'),court:f.get('court').trim(),room:f.get('room').trim(),parties:f.get('parties').trim(),opponent:f.get('opponent').trim(),judge:f.get('judge').trim(),status:f.get('status'),nextDate:f.get('nextDate'),previousAction:f.get('previousAction').trim(),notes:f.get('notes').trim(),updatedAt:new Date().toISOString()};cases=cases.filter(x=>x.id!==id);cases.push(c);$('#formWrap').innerHTML='';save()});
$('#list').onclick=e=>{const b=e.target.closest('button');if(!b)return;const c=cases.find(x=>x.id===b.dataset.edit||x.id===b.dataset.delete||x.id===b.dataset.print);if(!c)return;if(b.dataset.edit){form(c);return}if(b.dataset.delete){if(confirm('هل تريد حذف هذا الملف؟')){cases=cases.filter(x=>x.id!==c.id);save()}return}if(b.dataset.print){const w=window.open('','_blank');if(!w){alert('اسمح بفتح النوافذ المنبثقة للطباعة.');return}w.document.write('<html lang="ar" dir="rtl"><meta charset="utf-8"><title>'+esc(c.title)+'</title><body style="font-family:Tahoma,Arial;padding:30px;line-height:2"><h1>'+esc(c.title)+'</h1>'+['number','type','court','room','parties','opponent','judge','status','nextDate','previousAction','notes'].map(k=>'<p><b>'+({number:'رقم الملف',type:'نوع القضية',court:'المحكمة',room:'القاعة',parties:'الأطراف',opponent:'الخصم',judge:'القاضي المقرر',status:'الحالة',nextDate:'الجلسة القادمة',previousAction:'الإجراء السابق',notes:'الملاحظات'}[k])+' : </b>'+esc(c[k])+'</p>').join('')+'</body></html>');w.document.close();w.print()}};
$('#export').onclick=()=>{const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify({version:1,cases},null,2)],{type:'application/json'}));a.href=url;a.download='kalam-cases-backup.json';a.click();URL.revokeObjectURL(url)};
$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text()),arr=Array.isArray(d)?d:d.cases;if(!Array.isArray(arr))throw Error();if(!confirm('سيتم استبدال ملفات القضايا الحالية. هل تريد المتابعة؟'))return;cases=arr;save();alert('تم الاستيراد بنجاح')}catch{alert('تعذر قراءة ملف النسخة الاحتياطية')}e.target.value=''};
render();
</script></body></html>
